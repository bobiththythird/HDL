<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDL Levels</title>
<style>
  :root { --bg:#0d1420; --card:#1a2434; --card2:#202c3f; --line:rgba(148,163,184,.18); --ink:#f1f5f9; --dim:#94a3b8; --sky:#60a5fa; --green:#4ade80; --blue:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 80px; }
  h1 { margin:10px 0 4px; font-size:34px; font-weight:800; }
  .sub { color:var(--dim); margin:0 0 16px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--dim); padding:9px 16px; border-radius:10px; cursor:pointer; font:inherit; font-weight:600; }
  .tab[aria-pressed="true"] { background:var(--blue); color:#fff; border-color:var(--blue); }
  input[type=search], input[type=text] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  .cards { display:flex; flex-direction:column; gap:14px; margin-top:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; }
  .thumb { aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:linear-gradient(135deg,#223149,#141c2a); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .title { margin-top:10px; font-size:20px; font-weight:800; }
  .rank { color:var(--sky); margin-right:8px; }
  .by { color:var(--dim); font-size:15px; margin-top:2px; }
  .by .ver { color:var(--green); font-weight:600; }
  .hidden { display:none !important; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  .panel h2 { margin:0 0 10px; font-size:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid2 .full { grid-column:1/-1; }
  label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); display:block; margin-bottom:4px; }
  button.btn { background:var(--blue); color:#fff; border:0; padding:11px 18px; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
  button.btn.alt { background:var(--card2); border:1px solid var(--line); color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .item { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .n { flex:1; min-width:0; overflow-wrap:anywhere; }
  .item .n small { color:var(--dim); display:block; }
  .mini { background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
  .note { color:var(--dim); font-size:13px; }
  textarea { width:100%; min-height:120px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:13px/1.4 ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HDL</h1>
  <p class="sub">Not everything on this list is accurate.</p>

  <div class="tabs" id="tabs"></div>

  <div id="listView">
    <input type="search" id="search" placeholder="Search levels or creators...">
    <div class="cards" id="cards"></div>
  </div>

  <div id="adminView" class="hidden">
    <div class="panel">
      <h2>Add a level</h2>
      <div class="grid2">
        <div class="full"><label>Level name</label><input type="text" id="aName"></div>
        <div><label>Creator</label><input type="text" id="aCreator"></div>
        <div><label>Verifier</label><input type="text" id="aVerifier"></div>
        <div><label>Geometry Dash level ID</label><input type="text" id="aId" inputmode="numeric"></div>
        <div><label>Position (blank = bottom)</label><input type="text" id="aPos" inputmode="numeric"></div>
      </div>
      <div class="row"><button class="btn" id="addBtn">Add level</button></div>
    </div>

    <div class="panel">
      <h2>Edit, move or remove levels</h2>
      <div id="adminList"></div>
    </div>

    <div class="panel">
      <h2>Save your changes</h2>
      <p class="note">Changes show on this device straight away. To make them live for everyone, copy the updated levels below, paste them over the LEVELS list in index.html on GitHub, and commit.</p>
      <textarea id="export" readonly></textarea>
      <div class="row">
        <button class="btn" id="copyBtn">Copy levels</button>
        <button class="btn alt" id="resetBtn">Reset to published list</button>
      </div>
    </div>
  </div>
</div>

const KEY = "hdl-levels-v1";
let levels = null;
try { levels = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { levels = null; }
if (!levels) levels = LEVELS.map(l => ({...l}));
let admin = false;

const $ = id => document.getElementById(id);
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(levels)); } catch (e) {} renderAll(); };
const thumb = id => "https://levelthumbs.prevter.me/thumbnail/" + id + "/small";

function renderTabs() {
  const t = $("tabs"); t.replaceChildren();
  [["Levels (" + levels.length + ")", false], ["Admin", true]].forEach(([text, isAdmin]) => {
    const b = document.createElement("button");
    b.className = "tab"; b.textContent = text; b.setAttribute("aria-pressed", String(admin === isAdmin));
    b.onclick = () => { admin = isAdmin; renderAll(); };
    t.append(b);
  });
}

function renderCards() {
  const q = $("search").value.trim().toLowerCase();
  const box = $("cards"); box.replaceChildren();
  levels.forEach((l, i) => {
    if (q && !(l.name.toLowerCase().includes(q) || l.creator.toLowerCase().includes(q) || (l.verifier || "").toLowerCase().includes(q))) return;
    const card = document.createElement("div"); card.className = "card";
    const th = document.createElement("div"); th.className = "thumb";
    if (l.id) { const img = new Image(); img.loading = "lazy"; img.alt = ""; img.onerror = () => img.remove(); img.src = thumb(l.id); th.append(img); }
    const title = document.createElement("div"); title.className = "title";
    const r = document.createElement("span"); r.className = "rank"; r.textContent = "#" + (i + 1);
    title.append(r, l.name);
    const by = document.createElement("div"); by.className = "by";
    by.append(l.creator);
    if (l.verifier) { by.append(" \u00b7 "); const v = document.createElement("span"); v.className = "ver"; v.textContent = l.verifier; by.append(v); }
    card.append(th, title, by); box.append(card);
  });
}

function renderAdmin() {
  const box = $("adminList"); box.replaceChildren();
  levels.forEach((l, i) => {
    const row = document.createElement("div"); row.className = "item";
    const n = document.createElement("div"); n.className = "n";
    n.textContent = "#" + (i + 1) + " " + l.name;
    const s = document.createElement("small"); s.textContent = l.creator + (l.verifier ? " \u00b7 " + l.verifier : ""); n.append(s);
    const mk = (txt, fn) => { const b = document.createElement("button"); b.className = "mini"; b.textContent = txt; b.onclick = fn; return b; };
    row.append(n, mk("\u2191", () => move(i, -1)), mk("\u2193", () => move(i, 1)), mk("Edit", () => edit(l)),
      mk("Remove", () => { if (confirm("Remove " + l.name + "?")) { levels.splice(i, 1); persist(); } }));
    box.append(row);
  });
  $("export").value = "const LEVELS = " + JSON.stringify(levels, null, 1) + ";";
}

function move(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= levels.length) return;
  [levels[i], levels[j]] = [levels[j], levels[i]]; persist();
}

function edit(l) {
  const name = prompt("Level name", l.name); if (name === null) return;
  const creator = prompt("Creator", l.creator); if (creator === null) return;
  const verifier = prompt("Verifier", l.verifier || ""); if (verifier === null) return;
  const id = prompt("Geometry Dash level ID", l.id || ""); if (id === null) return;
  Object.assign(l, { name: name.trim() || l.name, creator: creator.trim(), verifier: verifier.trim(), id: parseInt(id, 10) || 0 });
  persist();
}

$("addBtn").onclick = () => {
  const name = $("aName").value.trim();
  if (!name) return alert("Give the level a name.");
  const lvl = { name, creator: $("aCreator").value.trim(), verifier: $("aVerifier").value.trim(), id: parseInt($("aId").value, 10) || 0 };
  const pos = parseInt($("aPos").value, 10);
  if (pos >= 1 && pos <= levels.length) levels.splice(pos - 1, 0, lvl); else levels.push(lvl);
  ["aName", "aCreator", "aVerifier", "aId", "aPos"].forEach(i => $(i).value = "");
  persist();
};
$("search").oninput = renderCards;
$("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText($("export").value); $("copyBtn").textContent = "Copied"; } catch { $("export").select(); } };
$("resetBtn").onclick = () => { if (confirm("Throw away local changes and go back to the published list?")) { try { localStorage.removeItem(KEY); } catch (e) {} levels = LEVELS.map(l => ({...l})); renderAll(); } };

function renderAll() {
  renderTabs();
  $("listView").classList.toggle("hidden", admin);
  $("adminView").classList.toggle("hidden", !admin);
  if (admin) renderAdmin(); else renderCards();
}
renderAll();
</script>
</body>
</html>
